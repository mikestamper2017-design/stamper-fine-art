<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mike Stamper | Fine Art & Sculpture</title>
  <link rel="stylesheet" href="style.css">
  <!-- Minimalist Lightbox for High-Res View -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.3.0/css/glightbox.min.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <h1 class="brand-title">MIKE STAMPER</h1>
      <p class="brand-subtitle">Fine Art &amp; Sculpture Studio</p>
    </div>
  </header>

  <main class="container">
    
    <!-- Controls Bar: Category Filters & Sorting -->
    <section class="controls-bar">
      
      <!-- Category Filter Tabs -->
      <div class="filter-group">
        <button class="filter-btn active" data-category="all">All Works</button>
        <button class="filter-btn" data-category="Sculpture">Sculpture</button>
        <button class="filter-btn" data-category="Paintings">Paintings</button>
        <button class="filter-btn" data-category="Watercolour">Watercolour</button>
      </div>

      <!-- Sorting Select -->
      <div class="sort-group">
        <label for="sort-select">Sort By:</label>
        <select id="sort-select" onchange="applyFiltersAndSort()">
          <option value="newest">Newest First</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="size-small">Size: Smallest First</option>
          <option value="size-large">Size: Largest First</option>
        </select>
      </div>

    </section>

    <!-- Active Featured Artwork Stage -->
    <section id="featured-stage" class="art-stage">
      <div class="image-wrapper">
        <a id="stage-lightbox-link" href="" class="glightbox">
          <img id="main-art-img" src="" alt="Featured Artwork" />
        </a>
      </div>
      
      <div class="stage-details">
        <div class="card-header">
          <h2 id="main-art-title" class="item-title">Select Artwork</h2>
          <span id="main-art-price" class="item-price"></span>
        </div>
        <p id="main-art-meta" class="item-meta"></p>
        <p id="main-art-materials" class="item-materials"></p>
        <a id="main-art-inquire" href="mailto:mike_stamper@hotmail.com?subject=Art%20Inquiry" class="btn-inquire">Inquire / Acquire</a>
      </div>
    </section>

    <!-- Horizontal Art Strip Reel -->
    <section class="reel-container">
      <div class="reel-header">
        <span>Quick Browse Collection</span>
        <span class="reel-hint">Swipe or click to view</span>
      </div>
      
      <!-- Dynamic Thumbnail Strip rendered via JavaScript -->
      <div id="art-strip-reel" class="art-strip-reel">
        <!-- Thumbnails populated by gallery-render.js -->
      </div>
    </section>

    <!-- Fallback Grid View for Catalog Overview -->
    <div id="art-grid" class="art-grid" style="display: none;">
      <!-- Standard Cards render dynamically if needed -->
    </div>

  </main>

  <!-- Contact Footer -->
  <footer class="site-footer">
    <div class="footer-content">
      <h3>Inquiries &amp; Acquisitions</h3>
      <p>Interested in a piece or commissioned artwork? Send an inquiry directly.</p>
      <a id="contact-btn" href="mailto:mike_stamper@hotmail.com?subject=Art%20Inquiry" class="btn-primary">Inquire About Works</a>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.3.0/js/glightbox.min.js"></script>
  <script src="gallery-render.js"></script>
</body>
</html>
