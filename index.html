<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mike Stamper | Fine Art & Sculpture</title>
  <link rel="stylesheet" href="style.css">
  <!-- Minimalist Lightbox for High-Res View -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.3.0/css/glightbox.min.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <h1 class="brand-title">MIKE STAMPER</h1>
      <p class="brand-subtitle">Fine Art &amp; Sculpture Studio</p>
    </div>
  </header>

  <main class="gallery-container">
    
    <!-- Controls Bar: Category Filters & Sorting -->
    <section class="controls-bar">
      
      <!-- Category Filter Tabs -->
      <div class="filter-group">
        <button class="filter-btn active" data-category="all">All Works</button>
        <button class="filter-btn" data-category="Sculpture">Sculpture</button>
        <button class="filter-btn" data-category="Paintings">Paintings</button>
        <button class="filter-btn" data-category="Watercolour">Watercolour</button>
      </div>

      <!-- Sorting Select -->
      <div class="sort-group">
        <label for="sort-select">Sort By:</label>
        <select id="sort-select" onchange="applyFiltersAndSort()">
          <option value="newest">Newest First</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="size-small">Size: Smallest First</option>
          <option value="size-large">Size: Largest First</option>
        </select>
      </div>

    </section>

    <!-- Dynamic Art Grid -->
    <div id="art-grid" class="art-grid">
      <!-- Cards render dynamically via app.js -->
    </div>

  </main>

  <!-- Contact Footer -->
  <footer class="site-footer">
    <div class="footer-content">
      <h3>Inquiries & Acquisitions</h3>
      <p>Interested in a piece or commissioned artwork? Send an inquiry directly.</p>
      <a id="contact-btn" href="mailto:mike_stamper@hotmail.com?subject=Art%20Inquiry" class="btn-primary">Inquire About Works</a>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.3.0/js/glightbox.min.js"></script>
  <script src="gallery-render.js"></script>
</body>
</html>
